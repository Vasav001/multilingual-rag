[project]
name = "multilang-rag"
version = "0.1.0"
description = "A simple multilingual RAG app (Gemini embeddings + Qdrant + Cohere rerank + Groq)"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "qdrant-client>=1.11",
    "google-genai>=0.3",
    "cohere>=5.11",
    "groq>=0.11",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "langdetect>=1.0.9",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
]

[tool.uv]
package = false
